<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPOM watch</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;background:#fafafa;color:#111}a.bm{display:inline-block;padding:12px 20px;background:#111;color:#fff;border-radius:8px;text-decoration:none;font-weight:600}@media(prefers-color-scheme:dark){body{background:#111;color:#eee}a.bm{background:#eee;color:#111}}</style></head>
<body><h1>SPOM watch</h1><p>Drag this button onto your bookmarks bar (Ctrl + Shift + B shows it):</p>
<p><a class="bm" href="javascript:(() =&gt; { if (window.__cpWatch) { alert(&#x27;SPOM watch is already on in this tab&#x27;); return; } window.__cpWatch = true; const title = document.title; const label = (prompt(&#x27;Name for this window (e.g. Set C)&#x27;, &#x27;&#x27;) || &#x27;SPOM&#x27;).slice(0, 20); try { Notification.requestPermission(); } catch (e) {} const docs = (d, out = []) =&gt; { out.push(d); for (const f of d.querySelectorAll(&#x27;iframe,frame&#x27;)) { try { if (f.contentDocument) docs(f.contentDocument, out); } catch (e) {} } return out; }; const shown = el =&gt; { const r = el.getBoundingClientRect(); return r.width &gt; 0 &amp;&amp; r.height &gt; 0; }; const question = d =&gt; [...d.querySelectorAll(&#x27;input[type=radio],input[type=checkbox]&#x27;)].some(shown) || [...d.querySelectorAll(&#x27;button,[role=button],a,div,span&#x27;)].some(el =&gt; el.children.length === 0 &amp;&amp; /^\s*(submit|check answer|check)\s*$/i.test(el.textContent || &#x27;&#x27;) &amp;&amp; shown(el)); let pausedSince = 0, alerted = false, flash, note; const push = why =&gt; { const url = &#x27;https://ntfy.sh/spom-a414deed5f/publish?&#x27; + new URLSearchParams({ title: label + &#x27; checkpoint&#x27;, message: why, priority: &#x27;high&#x27;, tags: &#x27;warning&#x27; }); fetch(url, { mode: &#x27;no-cors&#x27; }).catch(() =&gt; { new Image().src = url; }); }; const alertNow = why =&gt; { alerted = true; try { push(why); } catch (e) {} try { note = new Notification(label + &#x27;: checkpoint&#x27;, { body: why + &#x27; (click to open)&#x27;, requireInteraction: true, silent: true }); note.onclick = () =&gt; { window.focus(); note.close(); }; } catch (e) {} let on = false; flash = setInterval(() =&gt; { document.title = (on = !on) ? &#x27;⚠ &#x27; + label + &#x27; CHECKPOINT&#x27; : title; }, 700); }; const reset = () =&gt; { alerted = false; pausedSince = 0; clearInterval(flash); document.title = title; try { note &amp;&amp; note.close(); } catch (e) {} }; setInterval(() =&gt; { const all = docs(document); const vids = all.flatMap(d =&gt; [...d.querySelectorAll(&#x27;video,audio&#x27;)]); const playing = vids.some(v =&gt; !v.paused &amp;&amp; !v.ended); const stuck = vids.some(v =&gt; v.paused &amp;&amp; !v.ended &amp;&amp; v.currentTime &gt; 1); const q = all.some(question); if (playing &amp;&amp; !q) { if (alerted) reset(); pausedSince = 0; return; } if (alerted) return; if (q) return alertNow(&#x27;A question is on screen&#x27;); if (stuck) { pausedSince = pausedSince || Date.now(); if (Date.now() - pausedSince &gt; 4000) alertNow(&#x27;The lecture has paused&#x27;); } }, 1500); document.title = &#x27;✓ &#x27; + label + &#x27; watching&#x27;; setTimeout(() =&gt; { if (!alerted) document.title = title; }, 3000); })(); ">SPOM watch</a></p>
<p>Then, in each LMS lecture window, click it, name the window (e.g. Set C) and allow notifications. Click it again after a new lecture page loads.</p></body></html>
